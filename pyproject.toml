[project]
name = "logstats"
version = "0.1.0"
description = "Statistical report of the percentage of requests per Country, OS and Browser in an Apache web server log file"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
