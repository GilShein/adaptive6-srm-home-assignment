[project]
name = "logstats"
version = "0.1.0"
description = "Statistical report of the percentage of requests per Country, OS and Browser in an Apache web server log file"
requires-python = ">=3.13,<3.14"
dependencies = [
    "geoip2==5.3.0",
    "maxminddb==3.2.0",
    "ua-parser==1.0.2",
    "ua-parser-builtins==202610",
]

[project.scripts]
logstats = "logstats.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.run]
source = ["logstats"]
patch = ["subprocess"]
